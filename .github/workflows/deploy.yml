name: Backend Deploy (EC2)

# CD only. The existing "Phase 8 Backend Quality Gate" workflow provides CI.
# On push to a deploy branch this builds once (fail fast), then SSHes into EC2 and
# runs scripts/deploy.sh (pull -> migrate -> seed tags+measurement points -> build
# -> pm2 restart -> health check).
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   EC2_HOST     = 54.147.103.16
#   EC2_USER     = ec2-user
#   EC2_SSH_KEY  = full contents of WIEZ_KEY.pem (private key, incl. BEGIN/END lines)

# GitHub-hosted runners can sit in a queue for a long time before a pushed run is
# created — a push at 18:49 once produced runs stamped 19:19. During that window
# the run does not exist yet, so "no run for my SHA" looks identical to "CD is
# broken" and invites a hand-rolled deploy on the box. `workflow_dispatch` gives
# you a way to force the deploy instead of waiting or pushing an empty commit.
#
# Note: GitHub only offers workflow_dispatch for workflows present on the DEFAULT
# branch, so this file must reach `main` before the SIT deploy can be dispatched.
on:
  push:
    branches: [main, SIT]
  workflow_dispatch:
    inputs:
      validate_only:
        description: Build and verify this ref without changing the SIT server
        type: boolean
        default: false

concurrency:
  # Both refs use one EC2 checkout; their build/deploy runs must serialize.
  group: backend-deploy-ec2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-check:
    name: Build (fail fast before deploy)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      # Before the build, because a module cycle without forwardRef compiles
      # perfectly and only fails at boot — and only for whichever entry point
      # happens to load the graph first. That is how the SIT worker ended up
      # restarting 74,771 times over nine days while every check stayed green.
      - run: npm run check:module-cycles
      - name: Shared deployment lock regression
        run: bash scripts/verify-deploy-lock.sh
      - name: Destructive reset safety checks
        run: node --test scripts/reset-safety.test.cjs
      - run: npx prisma generate
      - name: Refund, debt and integrity regressions
        run: npm test -- src/custom-orders/custom-order-refund.service.spec.ts src/order/order.service.spec.ts src/common/payments/order-payment-reconciliation.util.spec.ts src/custom-order-admin/custom-order-admin.service.spec.ts src/payout/payout.service.spec.ts src/admin/payouts/admin-payouts.service.spec.ts src/admin/payouts/admin-payouts-webhook.controller.spec.ts src/collections/collections.service.spec.ts src/categories/categories.service.spec.ts src/tags/tag-index.service.spec.ts --runInBand
      - name: Upload privacy and finalization regressions
        run: npm test -- src/upload/upload.service.spec.ts src/upload/file-deletion-query.spec.ts src/collections/collection-cleanup-concurrency.spec.ts src/queue/image-processing.processor.spec.ts src/designs/mappers/design-response.mapper.spec.ts --runInBand
      - name: Provider protocol and upload-content boundaries
        run: |
          node scripts/test-refund-provider-contract.cjs
          node --test scripts/test-upload-content-security.cjs infrastructure/media-gateway/worker.test.cjs
      - name: Query batching and payment concurrency regressions
        run: npm test -- src/auth/auth.service.spec.ts src/subscriptions src/brands/brand-commerce-access.service.spec.ts src/brands/brand-customers.service.spec.ts src/finance/ledger.service.spec.ts src/finance/settlement-snapshot.service.spec.ts src/finance/standard-order-escrow.service.spec.ts src/finance/custom-order-finance-sync.service.spec.ts src/finance/settlement-policy.service.spec.ts src/finance/settlement-backfill.service.spec.ts src/store/collection-price-range.util.spec.ts src/store/bulk-unpublish.spec.ts src/store/bulk-product-taxonomy.spec.ts src/store/product-publication-batching.spec.ts src/content-integrity/content-integrity.service.spec.ts src/content-integrity/content-submission-batching.spec.ts src/collections/collection-membership-query.spec.ts src/collections/category-moderation-batching.spec.ts src/admin/featured/featured-expiry.spec.ts src/brands/permissions/brand-permission-batch.spec.ts src/custom-orders/checkout-bag-batching.spec.ts src/custom-orders/custom-orders.service.spec.ts src/custom-orders/custom-order-side-effects.service.spec.ts src/custom-order-ops/custom-order-ops.cron.service.spec.ts src/custom-orders/queue/intake-batch.spec.ts src/custom-orders/queue/custom-order-queue.service.spec.ts src/custom-orders/queue/custom-order-queue-refunds.service.spec.ts src/custom-orders/queue/paid-capture-admission.spec.ts src/tags/tag-usage-query.spec.ts src/tags/tag-reindex-batching.spec.ts src/collections/finalized-media-query.spec.ts src/payment/checkout-inventory-query.spec.ts src/notifications/notification-batch-query.spec.ts src/notifications/scheduled-notification-batching.spec.ts src/notifications/email-outbox-dispatcher.service.spec.ts src/notifications/push-outbox-batching.spec.ts src/notifications/push-notifications.service.spec.ts src/reviews/review-lifecycle.service.spec.ts src/queue/notification-durable-replay.spec.ts src/messaging/messaging-side-effects.service.spec.ts src/payment/payment.service.spec.ts src/payment/placement-notification-batching.spec.ts src/notifications/notifications.service.spec.ts src/posts/reaction-concurrency.spec.ts src/commentsv2/comment-delete-concurrency.spec.ts --runInBand
      - name: PostgreSQL ledger and complaint concurrency
        env:
          DATABASE_URL: postgresql://postgres:ci-disposable-only@localhost:5432/postgres
          VERIFY_LOCAL_REDIS_OUTBOX: "true"
        run: |
          node scripts/verify-ledger-concurrency.cjs
          node scripts/verify-custom-order-issue-race.cjs
          node scripts/verify-subscription-queue-postgres.cjs
          node scripts/verify-checkout-media-batching.cjs
          node scripts/verify-tag-sync-batching.cjs
          node scripts/verify-bulk-import-postgres.cjs
          node scripts/verify-file-deletion-postgres.cjs
          node scripts/verify-standard-refund-integrity.cjs
          node scripts/verify-fresh-schema.cjs --seed
          node scripts/verify-reset-bootstrap.cjs
      - run: npm run check:perf-regressions
      - run: npm run build

  deploy:
    name: Deploy to EC2 (PM2)
    needs: build-check
    if: ${{ (github.ref_name == 'main' || github.ref_name == 'SIT') && (github.event_name != 'workflow_dispatch' || !inputs.validate_only) }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 40m
          script_stop: true
          script: |
            set -e
            # Cover checkout mutation too, before deploy.sh is invoked.
            # --close keeps the lock out of PM2/other detached descendants.
            flock --wait 900 --close "$HOME/.wiez-backend-deploy.lock" bash -s <<'WIEZ_DEPLOY'
            set -e
            export DEPLOY_LOCK_HELD=1
            cd ~/WEAZ_Backend
            git fetch --all --prune
            git checkout "${{ github.ref_name }}"
            git reset --hard "origin/${{ github.ref_name }}"
            DEPLOY_BRANCH="${{ github.ref_name }}" bash scripts/deploy.sh
            WIEZ_DEPLOY
