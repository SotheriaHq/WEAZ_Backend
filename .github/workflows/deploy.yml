name: Backend Deploy (EC2)

# CD only. The existing "Phase 8 Backend Quality Gate" workflow provides CI.
# On push to a deploy branch this builds once (fail fast), then SSHes into EC2 and
# runs scripts/deploy.sh (pull -> migrate -> seed tags+measurement points -> build
# -> pm2 restart -> health check).
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   EC2_HOST     = 54.147.103.16
#   EC2_USER     = ec2-user
#   EC2_SSH_KEY  = full contents of WIEZ_KEY.pem (private key, incl. BEGIN/END lines)

# GitHub-hosted runners can sit in a queue for a long time before a pushed run is
# created — a push at 18:49 once produced runs stamped 19:19. During that window
# the run does not exist yet, so "no run for my SHA" looks identical to "CD is
# broken" and invites a hand-rolled deploy on the box. `workflow_dispatch` gives
# you a way to force the deploy instead of waiting or pushing an empty commit.
#
# Note: GitHub only offers workflow_dispatch for workflows present on the DEFAULT
# branch, so this file must reach `main` before the SIT deploy can be dispatched.
on:
  push:
    branches: [main, SIT]
  # No inputs needed: the "Run workflow" branch picker sets `github.ref_name`,
  # which is already what the deploy step checks out and passes to deploy.sh.
  workflow_dispatch:

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-check:
    name: Build (fail fast before deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  deploy:
    name: Deploy to EC2 (PM2)
    needs: build-check
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          script_stop: true
          script: |
            set -e
            cd ~/WEAZ_Backend
            git fetch --all --prune
            git checkout "${{ github.ref_name }}"
            git reset --hard "origin/${{ github.ref_name }}"
            DEPLOY_BRANCH="${{ github.ref_name }}" bash scripts/deploy.sh
