name: Phase 8 Backend Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
      - SIT

permissions:
  contents: read

jobs:
  backend-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: NestJS module cycle guard
        run: npm run check:module-cycles
      - name: Shared deployment lock regression
        run: bash scripts/verify-deploy-lock.sh

      - name: Destructive reset safety checks
        run: node --test scripts/reset-safety.test.cjs

      - name: Focused upload and design mapper tests
        run: npm test -- src/upload/upload.service.spec.ts src/designs/mappers/design-response.mapper.spec.ts --runInBand
      - name: Query batching and payment concurrency regressions
        run: npm test -- src/store/collection-price-range.util.spec.ts src/store/bulk-unpublish.spec.ts src/collections/collection-membership-query.spec.ts src/admin/featured/featured-expiry.spec.ts src/brands/permissions/brand-permission-batch.spec.ts src/custom-orders/checkout-bag-batching.spec.ts src/custom-orders/queue/intake-batch.spec.ts src/custom-orders/queue/custom-order-queue.service.spec.ts src/custom-orders/queue/paid-capture-admission.spec.ts src/tags/tag-usage-query.spec.ts --runInBand

      - name: Build
        run: npm run build

      - name: Performance and media privacy regression guard
        run: npm run check:perf-regressions
