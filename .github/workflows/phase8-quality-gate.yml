name: Phase 8 Backend Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
      - SIT

permissions:
  contents: read

jobs:
  backend-quality-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: NestJS module cycle guard
        run: npm run check:module-cycles
      - name: Shared deployment lock regression
        run: bash scripts/verify-deploy-lock.sh

      - name: Destructive reset safety checks
        run: node --test scripts/reset-safety.test.cjs

      - name: Focused upload and design mapper tests
        run: npm test -- src/upload/upload.service.spec.ts src/designs/mappers/design-response.mapper.spec.ts --runInBand
      - name: Query batching and payment concurrency regressions
        run: npm test -- src/subscriptions src/brands/brand-commerce-access.service.spec.ts src/brands/brand-customers.service.spec.ts src/finance/ledger.service.spec.ts src/store/collection-price-range.util.spec.ts src/store/bulk-unpublish.spec.ts src/collections/collection-membership-query.spec.ts src/admin/featured/featured-expiry.spec.ts src/brands/permissions/brand-permission-batch.spec.ts src/custom-orders/checkout-bag-batching.spec.ts src/custom-orders/custom-orders.service.spec.ts src/custom-order-ops/custom-order-ops.cron.service.spec.ts src/custom-orders/queue/intake-batch.spec.ts src/custom-orders/queue/custom-order-queue.service.spec.ts src/custom-orders/queue/paid-capture-admission.spec.ts src/tags/tag-usage-query.spec.ts --runInBand
      - name: PostgreSQL ledger and complaint concurrency
        env:
          DATABASE_URL: postgresql://postgres:ci-disposable-only@localhost:5432/postgres
        run: |
          node scripts/verify-ledger-concurrency.cjs
          node scripts/verify-custom-order-issue-race.cjs
          node scripts/verify-subscription-queue-postgres.cjs
          node scripts/verify-fresh-schema.cjs --seed
          node scripts/verify-reset-bootstrap.cjs

      - name: Build
        run: npm run build

      - name: Performance and media privacy regression guard
        run: npm run check:perf-regressions
